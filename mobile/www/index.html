<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https:; img-src https: data:;">
<title>Realm</title>
<style>
body { background:#09090b; color:#fafafa; font-family:system-ui; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
.box { text-align:center; padding:32px; }
h1 { color:#7c3aed; font-size:28px; }
p { color:#a1a1aa; font-size:14px; margin-top:8px; }
.lock { color:#22c55e; font-size:12px; margin-top:6px; }
.err { color:#ef4444; font-size:13px; margin-top:12px; }
.spinner { width:28px; height:28px; border:3px solid #27272a; border-top-color:#7c3aed; border-radius:50%; animation:spin .7s linear infinite; margin:20px auto 0; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <h1>Realm</h1>
  <p id="status">Connexion en cours…</p>
  <div class="spinner" id="spin"></div>
  <p class="lock" id="lock"></p>
  <p class="err" id="err"></p>
</div>
<script>
  var _e = atob('aHR0cHM6Ly9uYW91ZmVsLXRoaW5rY2VudHJlLW03MDAudGFpbGY5YmYxYi50cy5uZXQ=');
  var saved = localStorage.getItem('realm_server') || _e;

  async function go(url) {
    try {
      var controller = new AbortController();
      var t = setTimeout(function() { controller.abort(); }, 10000);
      var r = await fetch(url + '/api/info', { signal: controller.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error('srv');
      localStorage.setItem('realm_server', url);
      document.getElementById('lock').textContent = 'Connexion sécurisée';
      window.location.href = url;
    } catch(e) {
      document.getElementById('spin').style.display = 'none';
      document.getElementById('status').textContent = 'Serveur injoignable';
      document.getElementById('err').textContent = e.name === 'AbortError' ? 'Timeout — vérifiez votre connexion' : e.message;
    }
  }

  go(saved);
</script>
</body>
</html>
